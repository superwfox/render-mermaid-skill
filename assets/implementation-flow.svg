<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img">
  <style>
    .panel-label, .node-label, .edge-label {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-rendering: geometricPrecision;
    }
    .panel { fill: #F7F8FA; fill-opacity: .86; stroke: #D7DEE8; stroke-width: 2; }
    .panel-label { fill: #667085; font-size: 22px; font-weight: 700; }
    .node { fill: #FFFFFF; stroke: #D7DEE8; stroke-width: 2; filter: url(#softShadow); }
    .primary { fill: #3976D8; stroke: #2457A6; stroke-width: 2.5; filter: url(#softShadow); }
    .decision { fill: #EAF2FF; stroke: #7EA6DD; stroke-width: 2; filter: url(#softShadow); }
    .node-label { fill: #202938; font-size: 19px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
    .primary-label { fill: #FFFFFF; }
    .edge { fill: none; stroke: #98A2B3; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGray); }
    .return-edge { stroke: #3976D8; marker-end: url(#arrowBlue); }
    .edge-label-bg { fill: #FFFFFF; fill-opacity: .96; stroke: #E4E9F0; stroke-width: 1; }
    .edge-label { fill: #667085; font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <defs>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12Z" fill="#3976D8"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12Z" fill="#98A2B3"/>
    </marker>
  </defs>

  <rect class="panel" x="40" y="50" width="630" height="340" rx="28"/>
  <rect class="panel" x="770" y="50" width="630" height="340" rx="28"/>
  <rect class="panel" x="40" y="470" width="430" height="370" rx="28"/>
  <rect class="panel" x="520" y="470" width="880" height="370" rx="28"/>

  <text class="panel-label" x="70" y="94">输入与理解</text>
  <text class="panel-label" x="800" y="94">SVG 生成</text>
  <text class="panel-label" x="70" y="514">质量闭环</text>
  <text class="panel-label" x="550" y="514">浏览器渲染</text>

  <path class="edge" d="M240 210H275"/>
  <path class="edge" d="M485 210H535"/>
  <path class="edge" d="M640 192C706 192 734 170 800 170"/>
  <path class="edge" d="M640 228C706 228 734 295 800 295"/>
  <path class="edge" d="M1040 170C1085 170 1098 197 1140 205"/>
  <path class="edge" d="M1040 295C1085 295 1098 223 1140 215"/>
  <path class="edge" d="M1245 240C1245 360 1260 455 1260 575"/>
  <path class="edge" d="M1170 630H1125"/>
  <path class="edge" d="M950 630H910"/>
  <path class="edge" d="M760 630H710"/>
  <path class="edge" d="M550 615H440"/>
  <path class="edge" d="M280 622H245"/>
  <path class="edge" d="M150 660C150 692 155 707 160 735"/>
  <path class="edge" d="M215 650C260 670 300 700 340 725"/>
  <path class="edge" d="M550 665C510 680 486 735 445 765"/>
  <path class="edge return-edge" d="M372 725C482 650 478 300 535 228"/>

  <rect class="edge-label-bg" x="680" y="139" width="92" height="32" rx="16"/>
  <text class="edge-label" x="726" y="155">直接渲染</text>
  <rect class="edge-label-bg" x="662" y="274" width="130" height="32" rx="16"/>
  <text class="edge-label" x="727" y="290">需要重排或增强</text>
  <rect class="edge-label-bg" x="468" y="584" width="54" height="30" rx="15"/>
  <text class="edge-label" x="495" y="599">通过</text>
  <rect class="edge-label-bg" x="474" y="688" width="54" height="30" rx="15"/>
  <text class="edge-label" x="501" y="703">失败</text>
  <rect class="edge-label-bg" x="82" y="681" width="54" height="30" rx="15"/>
  <text class="edge-label" x="109" y="696">通过</text>
  <rect class="edge-label-bg" x="234" y="674" width="68" height="30" rx="15"/>
  <text class="edge-label" x="268" y="689">未通过</text>

  <rect class="primary" x="70" y="175" width="170" height="70" rx="35"/>
  <text class="node-label primary-label" x="155" y="211">MMD / SVG 输入</text>

  <rect class="node" x="275" y="145" width="210" height="130" rx="18"/>
  <text class="node-label" x="380" y="194">
    <tspan x="380" dy="0">读取节点、分组、边</tspan>
    <tspan x="380" dy="32">标签与方向</tspan>
  </text>

  <rect class="decision" x="535" y="175" width="105" height="70" rx="35"/>
  <text class="node-label" x="587.5" y="197">
    <tspan x="587.5" dy="0">选择</tspan>
    <tspan x="587.5" dy="27">渲染路线</tspan>
  </text>

  <rect class="node" x="800" y="130" width="240" height="80" rx="18"/>
  <text class="node-label" x="920" y="157">
    <tspan x="920" dy="0">Mermaid Runtime</tspan>
    <tspan x="920" dy="29">直接渲染</tspan>
  </text>

  <rect class="node" x="800" y="255" width="240" height="80" rx="18"/>
  <text class="node-label" x="920" y="282">
    <tspan x="920" dy="0">ClaudeLike 模板</tspan>
    <tspan x="920" dy="29">设计 SVG</tspan>
  </text>

  <rect class="node" x="1140" y="175" width="210" height="70" rx="18"/>
  <text class="node-label" x="1245" y="211">统一 SVG</text>

  <rect class="node" x="1170" y="575" width="180" height="110" rx="18"/>
  <text class="node-label" x="1260" y="599">
    <tspan x="1260" dy="0">脚本、事件</tspan>
    <tspan x="1260" dy="28">与外部资源</tspan>
    <tspan x="1260" dy="28">安全检查</tspan>
  </text>

  <rect class="node" x="950" y="590" width="175" height="80" rx="18"/>
  <text class="node-label" x="1037.5" y="617">
    <tspan x="1037.5" dy="0">嵌入本地</tspan>
    <tspan x="1037.5" dy="29">Noto Sans SC</tspan>
  </text>

  <rect class="node" x="760" y="590" width="150" height="80" rx="18"/>
  <text class="node-label" x="835" y="617">
    <tspan x="835" dy="0">Chromium</tspan>
    <tspan x="835" dy="29">精确渲染</tspan>
  </text>

  <rect class="node" x="550" y="575" width="160" height="110" rx="18"/>
  <text class="node-label" x="630" y="599">
    <tspan x="630" dy="0">文字、节点</tspan>
    <tspan x="630" dy="28">边线与裁切</tspan>
    <tspan x="630" dy="28">审计</tspan>
  </text>

  <rect class="node" x="280" y="575" width="160" height="95" rx="18"/>
  <text class="node-label" x="360" y="608">
    <tspan x="360" dy="0">浏览器截图生成</tspan>
    <tspan x="360" dy="30">透明 2× PNG</tspan>
  </text>

  <rect class="decision" x="100" y="585" width="145" height="75" rx="37.5"/>
  <text class="node-label" x="172.5" y="609">
    <tspan x="172.5" dy="0">多模态</tspan>
    <tspan x="172.5" dy="28">视觉验收</tspan>
  </text>

  <rect class="primary" x="70" y="735" width="180" height="70" rx="35"/>
  <text class="node-label primary-label" x="160" y="771">交付 SVG + PNG</text>

  <rect class="node" x="300" y="725" width="145" height="85" rx="18"/>
  <text class="node-label" x="372.5" y="753">
    <tspan x="372.5" dy="0">调整布局</tspan>
    <tspan x="372.5" dy="29">或样式</tspan>
  </text>
</svg>
