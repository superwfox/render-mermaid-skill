name: Render smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Render README implementation diagram
        run: node scripts/render.cjs assets/implementation-flow.mmd --out-dir tests/output/readme --scale 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-smoke-output
          path: tests/output/
          if-no-files-found: ignore
